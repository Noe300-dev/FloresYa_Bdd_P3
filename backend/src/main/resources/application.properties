spring.application.name=floresya-backend
server.port=8080

# ---------- MySQL ----------
# Si usas XAMPP el usuario es root y la clave va vacía (valores por defecto).
# Para cambiarlos sin editar este archivo define las variables DB_USER y DB_PASSWORD.
spring.datasource.url=jdbc:mysql://localhost:3306/floresya?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=Informatica.26
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ---------- JPA / Hibernate ----------
# update = crea y ajusta las tablas automáticamente a partir de las entidades (model)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ---------- CORS (frontend Vite) ----------
floresya.cors.origins=http://localhost:5173,http://127.0.0.1:5173

# ---------- Usuarios iniciales (se crean solo si no existen) ----------
floresya.admin.nombre=Administrador
floresya.admin.correo=admin@floresya.cl
floresya.admin.password=admin123
floresya.admin.telefono=+56912345678
    
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
# ---------- JWT ----------
# Clave secreta (idealmente en Base64 y de al menos 256 bits / 32 bytes para HS256)
jwt.secret=${JWT_SECRET:Y2xhdmUtc2VjcmV0YS1kZS1kZXNhcnJvbGxvLWZsb3Jlc3lhLTIwMjYtMzItYnl0ZXM=}
# Tiempo de expiración en milisegundos (24 horas)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- Google Sign-In ----------
# Client ID de Google Cloud (OAuth 2.0, aplicación web). Puedes definir la variable GOOGLE_CLIENT_ID.
google.client.id=${GOOGLE_CLIENT_ID:527750334036.apps.googleusercontent.com}
